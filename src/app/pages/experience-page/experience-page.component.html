<article class="content experience-content">
  <p class="kicker">EXPERIENCE</p>
  <h2>What I Bring</h2>

  <div class="experience-list">
    @for (job of data.experience; track job.role) {
      <div class="job">
        <span>{{ job.period }}</span>
        <h3>{{ job.role }}</h3>
        <b>{{ job.company }}</b>
        <p>{{ job.summary }}</p>
      </div>
    }
  </div>

  <div class="certs">
    <strong>Selected certifications</strong>
    <p>{{ data.certifications.join(' · ') }}</p>
  </div>
</article>
